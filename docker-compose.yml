# Local infrastructure for running the three services and the broker by hand.
# The tests do not use this file: they start their own Postgres and Pact Broker
# through Testcontainers.
#
# Ports checked before choosing them: 5432 and 9292 were free on this machine
# (the user's own containers hold 27017, 8083 and 4873).

services:

  catalog-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: catalog
      POSTGRES_USER: catalog
      POSTGRES_PASSWORD: catalog
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalog -d catalog"]
      interval: 5s
      timeout: 3s
      retries: 10

  # The broker keeps its own database: contracts, verification results and
  # deployments are its state, not the catalog's. Not published on the host.
  broker-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: broker
      POSTGRES_USER: broker
      POSTGRES_PASSWORD: broker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U broker -d broker"]
      interval: 5s
      timeout: 3s
      retries: 10

  pact-broker:
    image: pactfoundation/pact-broker:3.2.0-pactbroker2.124.0
    depends_on:
      broker-db:
        condition: service_healthy
    environment:
      PACT_BROKER_DATABASE_URL: postgres://broker:broker@broker-db/broker
      PACT_BROKER_LOG_LEVEL: WARN
    ports:
      - "9292:9292"
    # 127.0.0.1, not localhost: inside the image localhost resolves to ::1 first and
    # the broker listens on IPv4 only, so the check would fail on a healthy broker.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9292/diagnostic/status/heartbeat"]
      interval: 5s
      timeout: 3s
      retries: 20
